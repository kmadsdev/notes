name: Feature request
description: Suggest an idea for notes.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the problem or workflow first. What gets in your way today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
  - type: checkboxes
    id: fit
    attributes:
      label: Fit
      options:
        - label: This can work in a single HTML file with no backend.
        - label: I'd be willing to open a pull request for this.
