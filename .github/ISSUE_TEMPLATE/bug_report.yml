name: Bug report
description: Something in notes doesn't work the way it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report this. Please check [existing issues](https://github.com/kmadsdev/notes/issues) first.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a new file named `example.yaml`
        2. Paste …
        3. Open the preview
    validations:
      required: true
  - type: textarea
    id: sample
    attributes:
      label: Sample file
      description: If the bug depends on file content, paste a minimal example. Remove anything private.
      render: text
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Chrome 140, Firefox 143, Safari 26 on iOS …
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [macOS, Windows, Linux, iOS / iPadOS, Android, Other]
    validations:
      required: true
  - type: textarea
    id: console
    attributes:
      label: Console output
      description: Errors from the browser's developer console, if any.
      render: text
